kind = "mobile"
previewPath = "/chofer/"
title = "LogiFleet Chofer"
version = "1.0.0"
id = "artifacts/chofer"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/chofer/" ]
localPort = 18505

[services.development]
run = "pnpm --filter @workspace/chofer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chofer", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/chofer", "run", "serve" ]

[services.env]
PORT = "18505"
BASE_PATH = "/chofer/"
