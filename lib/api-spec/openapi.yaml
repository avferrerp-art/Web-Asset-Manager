openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Corporate Logistics Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vehicles
    description: Vehicle fleet management
  - name: personnel
    description: Driver and assistant management
  - name: sales
    description: Sales orders management
  - name: dispatches
    description: Dispatch and pre-dispatch management
  - name: tolls
    description: Toll routes management (legacy)
  - name: routes
    description: Routes management with toll stations and waypoints
  - name: fuel-prices
    description: Configurable fuel prices used in cost estimation
  - name: dashboard
    description: Dashboard and summary data
  - name: odoo
    description: Odoo sales order synchronization
  - name: driver
    description: Driver mobile app endpoints (authenticated driver scope)
  - name: products
    description: Product catalog synced from Odoo with manual dimensions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # --- FUEL PRICES ---
  /fuel-prices:
    get:
      operationId: listFuelPrices
      tags: [fuel-prices]
      summary: List configured fuel prices by fuel type
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FuelPrice"

  /fuel-prices/{tipoCombustible}:
    patch:
      operationId: updateFuelPrice
      tags: [fuel-prices]
      summary: Update (or create) the price per liter for a fuel type
      parameters:
        - name: tipoCombustible
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FuelPriceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelPrice"
        "400":
          description: Invalid input

  # --- VEHICLES ---
  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List all vehicles
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get a vehicle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
    patch:
      operationId: updateVehicle
      tags: [vehicles]
      summary: Update a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      summary: Delete a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- PERSONNEL ---
  /personnel:
    get:
      operationId: listPersonnel
      tags: [personnel]
      summary: List all personnel
      responses:
        "200":
          description: List of personnel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Personnel"
    post:
      operationId: createPersonnel
      tags: [personnel]
      summary: Create a personnel record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonnelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personnel"

  /personnel/{id}:
    get:
      operationId: getPersonnel
      tags: [personnel]
      summary: Get personnel by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Personnel record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personnel"
        "404":
          description: Not found
    patch:
      operationId: updatePersonnel
      tags: [personnel]
      summary: Update personnel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonnelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personnel"
        "404":
          description: Not found
    delete:
      operationId: deletePersonnel
      tags: [personnel]
      summary: Delete personnel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- SALES ---
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List all sales
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Create a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get a sale by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "404":
          description: Not found
    patch:
      operationId: updateSale
      tags: [sales]
      summary: Update a sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "404":
          description: Not found
    delete:
      operationId: deleteSale
      tags: [sales]
      summary: Delete a sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- SALE ITEMS ---
  /sales/{saleId}/items:
    get:
      operationId: listSaleItems
      tags: [sales]
      summary: List items for a sale
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of sale items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaleItem"
    post:
      operationId: createSaleItem
      tags: [sales]
      summary: Add an item to a sale
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleItem"

  /sales/{id}/deliveries:
    get:
      operationId: listSaleDeliveries
      tags: [sales]
      summary: List albaranes (Odoo deliveries) for a sale, with items embedded, non-cancelled first then by fechaProgramada desc
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of deliveries for the sale
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "404":
          description: Sale not found

  /sales/items/{itemId}:
    patch:
      operationId: updateSaleItem
      tags: [sales]
      summary: Update a sale item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleItem"
        "404":
          description: Not found
    delete:
      operationId: deleteSaleItem
      tags: [sales]
      summary: Delete a sale item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- UNLINKED SALE ITEMS ---
  /sale-items/sin-vincular:
    get:
      operationId: listUnlinkedSaleItems
      tags: [sales]
      summary: List sale items without a linked product (productId null)
      responses:
        "200":
          description: List of unlinked sale items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnlinkedSaleItem"

  /sale-items/{itemId}/vincular:
    post:
      operationId: linkSaleItemProduct
      tags: [sales]
      summary: Manually link a sale item to a catalog product (copies confirmed dimensions and recalculates sale totals)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkSaleItemInput"
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleItem"
        "404":
          description: Item or product not found

  # --- ODOO SYNC ---
  /odoo/status:
    get:
      operationId: getOdooStatus
      tags: [odoo]
      summary: Get Odoo connection configuration and last sync status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooStatus"

  /odoo/test-connection:
    post:
      operationId: testOdooConnection
      tags: [odoo]
      summary: Test the Odoo connection with the configured credentials
      responses:
        "200":
          description: Connection successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooTestResult"
        "400":
          description: Connection failed (missing config or invalid credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooTestResult"

  /odoo/sync:
    post:
      operationId: syncOdooNow
      tags: [odoo]
      summary: Trigger an immediate sync (import + update) of confirmed Odoo sale orders
      parameters:
        - name: dryRun
          in: query
          required: false
          schema:
            type: boolean
          description: When true, report what would change without writing anything
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooSyncResult"
        "400":
          description: Sync failed (missing config or connection error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooSyncResult"

  /odoo/sync-products:
    post:
      operationId: syncOdooProducts
      tags: [odoo]
      summary: Sync the product catalog from Odoo (never overwrites manual fields)
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSyncResult"
        "400":
          description: Sync failed (missing config or connection error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSyncResult"

  /odoo/sync-deliveries:
    post:
      operationId: syncOdooDeliveries
      tags: [odoo]
      summary: Sync albaranes (stock.picking outgoing) from Odoo into the deliveries table
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySyncResult"
        "400":
          description: Sync failed (missing config or connection error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySyncResult"

  /odoo/alerts:
    get:
      operationId: listOdooAlerts
      tags: [odoo]
      summary: List sync alerts (non-pending orders changed in Odoo)
      parameters:
        - name: includeResolved
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of sync alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncAlert"

  /odoo/alerts/{id}/resolve:
    post:
      operationId: resolveOdooAlert
      tags: [odoo]
      summary: Mark a sync alert as resolved
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert resolved
          content:
            application/json:
              schema:
                type: object
                required: [ok, id]
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
        "404":
          description: Alert not found

  # --- PRODUCTS ---
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with optional search and missing-dimensions filter
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: soloSinDimensiones
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/stats:
    get:
      operationId: getProductStats
      tags: [products]
      summary: Counts of products with confirmed dimensions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStats"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update manual fields of a product (Odoo-owned fields are read-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

  # --- DISPATCHES ---
  /dispatches:
    get:
      operationId: listDispatches
      tags: [dispatches]
      summary: List all dispatches
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of dispatches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dispatch"
    post:
      operationId: createDispatch
      tags: [dispatches]
      summary: Create a dispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"

  /dispatches/{id}:
    get:
      operationId: getDispatch
      tags: [dispatches]
      summary: Get a dispatch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dispatch with route points and costs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchDetail"
        "404":
          description: Not found
    patch:
      operationId: updateDispatch
      tags: [dispatches]
      summary: Update a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
        "404":
          description: Not found
    delete:
      operationId: deleteDispatch
      tags: [dispatches]
      summary: Delete a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /dispatches/{id}/approve:
    post:
      operationId: approveDispatch
      tags: [dispatches]
      summary: Approve a dispatch (changes status to approved/en-route)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dispatch approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
        "404":
          description: Not found

  /dispatches/{id}/costs:
    get:
      operationId: getDispatchCosts
      tags: [dispatches]
      summary: Get travel costs for a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Travel costs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelCost"
        "404":
          description: Not found
    patch:
      operationId: updateDispatchCosts
      tags: [dispatches]
      summary: Update travel costs for a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelCostInput"
      responses:
        "200":
          description: Costs updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelCost"
        "404":
          description: Not found

  /dispatches/{id}/route-points:
    get:
      operationId: listRoutePoints
      tags: [dispatches]
      summary: List route points for a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Route points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoutePoint"
    post:
      operationId: addRoutePoint
      tags: [dispatches]
      summary: Add a route point to a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutePointInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePoint"

  /dispatches/{dispatchId}/route-points/{pointId}:
    delete:
      operationId: deleteRoutePoint
      tags: [dispatches]
      summary: Remove a route point
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema:
            type: integer
        - name: pointId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- VEHICLE RECOMMENDATION ---
  /vehicles/recommend:
    post:
      operationId: recommendVehicle
      tags: [vehicles]
      summary: Recommend the best vehicle for a given load
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadRequirement"
      responses:
        "200":
          description: Recommended vehicles sorted by suitability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  # --- COST ESTIMATION ---
  /dispatches/{id}/estimate-costs:
    get:
      operationId: estimateDispatchCosts
      tags: [dispatches]
      summary: Estimate costs for a dispatch before approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Estimated costs breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostEstimate"
        "404":
          description: Not found

  /dispatches/estimate-costs-preview:
    post:
      operationId: estimateDispatchCostsPreview
      tags: [dispatches]
      summary: Estimate costs for a dispatch before it is created, using the same formula as estimateDispatchCosts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchCostEstimateInput"
      responses:
        "200":
          description: Estimated costs breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostEstimate"
        "400":
          description: Invalid input

  # --- DRIVER (mobile app) ---
  /driver/me:
    get:
      operationId: getDriverMe
      tags: [driver]
      summary: Get the personnel record linked to the authenticated user's email
      responses:
        "200":
          description: Driver profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personnel"
        "404":
          description: No personnel record linked to this account

  /driver/dispatches:
    get:
      operationId: listDriverDispatches
      tags: [driver]
      summary: List dispatches assigned to the authenticated driver
      responses:
        "200":
          description: Dispatches assigned to this driver
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dispatch"
        "404":
          description: No personnel record linked to this account

  /driver/dispatches/{id}:
    get:
      operationId: getDriverDispatch
      tags: [driver]
      summary: Get one of the authenticated driver's dispatches with detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dispatch detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchDetail"
        "404":
          description: Not found or not assigned to this driver

  /driver/dispatches/{id}/route-points/{pointId}/complete:
    post:
      operationId: completeDriverRoutePoint
      tags: [driver]
      summary: Toggle a route point as completed by the authenticated driver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: pointId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutePointCompleteInput"
      responses:
        "200":
          description: Updated route point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePoint"
        "404":
          description: Not found or not assigned to this driver

  /driver/dispatches/{id}/status:
    post:
      operationId: updateDriverDispatchStatus
      tags: [driver]
      summary: Update the status of a dispatch assigned to the authenticated driver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverStatusUpdateInput"
      responses:
        "200":
          description: Updated dispatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
        "400":
          description: Invalid status transition
        "404":
          description: Not found or not assigned to this driver

  # --- TOLLS ---
  /tolls:
    get:
      operationId: listTolls
      tags: [tolls]
      summary: List all toll routes
      responses:
        "200":
          description: List of toll routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TollRoute"
    post:
      operationId: createToll
      tags: [tolls]
      summary: Create a toll route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TollRouteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TollRoute"

  /tolls/{id}:
    patch:
      operationId: updateToll
      tags: [tolls]
      summary: Update a toll route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TollRouteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TollRoute"
        "404":
          description: Not found
    delete:
      operationId: deleteToll
      tags: [tolls]
      summary: Delete a toll route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- ROUTES ---
  /routes:
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List all routes with embedded tolls and waypoints
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
    post:
      operationId: createRoute
      tags: [routes]
      summary: Create a route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"

  /routes/{id}:
    get:
      operationId: getRoute
      tags: [routes]
      summary: Get a route by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Route with tolls and waypoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: Not found
    patch:
      operationId: updateRoute
      tags: [routes]
      summary: Update a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: Not found
    delete:
      operationId: deleteRoute
      tags: [routes]
      summary: Delete a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /routes/{id}/tolls:
    post:
      operationId: addRouteToll
      tags: [routes]
      summary: Add a toll station to a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteTollInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteToll"

  /routes/{routeId}/tolls/{tollId}:
    patch:
      operationId: updateRouteToll
      tags: [routes]
      summary: Update a toll station's name, order, or tarifa
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
        - name: tollId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteTollUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteToll"
        "404":
          description: Not found
    delete:
      operationId: deleteRouteToll
      tags: [routes]
      summary: Remove a toll station from a route
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
        - name: tollId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /routes/{id}/waypoints:
    post:
      operationId: addRouteWaypoint
      tags: [routes]
      summary: Add a waypoint to a route (multidestino)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteWaypointInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteWaypoint"

  /routes/{routeId}/waypoints/{waypointId}:
    patch:
      operationId: updateRouteWaypoint
      tags: [routes]
      summary: Update a waypoint (reorder or rename)
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
        - name: waypointId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteWaypointUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteWaypoint"
        "404":
          description: Not found
    delete:
      operationId: deleteRouteWaypoint
      tags: [routes]
      summary: Remove a waypoint from a route
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
        - name: waypointId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- DASHBOARD ---
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/vehicle-schedule:
    get:
      operationId: getVehicleSchedule
      tags: [dashboard]
      summary: Get weekly vehicle availability schedule
      parameters:
        - name: weekStart
          in: query
          required: false
          schema:
            type: string
            description: ISO date string for start of week (defaults to current week)
      responses:
        "200":
          description: Vehicle schedule for the week
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleScheduleEntry"

  /dashboard/active-dispatches:
    get:
      operationId: getActiveDispatches
      tags: [dashboard]
      summary: Get currently active dispatches (in transit)
      responses:
        "200":
          description: Active dispatches with vehicle and route info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveDispatch"

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # --- VEHICLES ---
    Vehicle:
      type: object
      required: [id, tipo, modelo, capacidadPeso, capacidadVolumen, tipoCombustible, rendimientoKmLitro, createdAt]
      properties:
        id:
          type: integer
        tipo:
          type: string
          description: "propio | tercero"
        modelo:
          type: string
        capacidadPeso:
          type: number
          description: Max weight capacity in kg
        capacidadVolumen:
          type: number
          description: Max volume capacity in m3
        tipoCombustible:
          type: string
          description: "gasolina | diesel | gas"
        rendimientoKmLitro:
          type: number
          description: Fuel efficiency in km/liter
        placa:
          type: ["string", "null"]
        tarifaPeaje:
          type: ["number", "null"]
          description: Tarifa de peaje por despacho en moneda local
        tanqueLitros:
          type: ["number", "null"]
          description: Capacidad del tanque en litros
        createdAt:
          type: string

    VehicleInput:
      type: object
      required: [tipo, modelo, capacidadPeso, capacidadVolumen, tipoCombustible, rendimientoKmLitro]
      properties:
        tipo:
          type: string
        modelo:
          type: string
        capacidadPeso:
          type: number
        capacidadVolumen:
          type: number
        tipoCombustible:
          type: string
        rendimientoKmLitro:
          type: number
        placa:
          type: string
        tarifaPeaje:
          type: number
        tanqueLitros:
          type: number

    VehicleUpdate:
      type: object
      properties:
        tipo:
          type: string
        modelo:
          type: string
        capacidadPeso:
          type: number
        capacidadVolumen:
          type: number
        tipoCombustible:
          type: string
        rendimientoKmLitro:
          type: number
        placa:
          type: string
        tarifaPeaje:
          type: number
        tanqueLitros:
          type: number

    LoadRequirement:
      type: object
      required: [pesoTotal, volumenTotal]
      properties:
        pesoTotal:
          type: number
        volumenTotal:
          type: number

    # --- PERSONNEL ---
    Personnel:
      type: object
      required: [id, nombre, rol, tarifaViaticos, createdAt]
      properties:
        id:
          type: integer
        nombre:
          type: string
        rol:
          type: string
          description: "chofer | ayudante"
        tarifaViaticos:
          type: number
          description: Daily per-diem rate
        telefono:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
          description: Email used to link a Clerk account to this driver
        createdAt:
          type: string

    PersonnelInput:
      type: object
      required: [nombre, rol, tarifaViaticos]
      properties:
        nombre:
          type: string
        rol:
          type: string
        tarifaViaticos:
          type: number
        telefono:
          type: string
        email:
          type: string

    PersonnelUpdate:
      type: object
      properties:
        nombre:
          type: string
        rol:
          type: string
        tarifaViaticos:
          type: number
        telefono:
          type: string
        email:
          type: string

    DriverStatusUpdateInput:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [en-ruta, entregado]
          description: New status the driver sets for the dispatch

    # --- SALES ---
    OdooStatus:
      type: object
      required: [configured, serverUrl, lastSyncAt, lastResult, lastError, importedCount, skippedCount]
      properties:
        configured:
          type: boolean
        serverUrl:
          type: ["string", "null"]
        lastSyncAt:
          type: ["string", "null"]
        lastResult:
          type: ["string", "null"]
          description: "ok | error"
        lastError:
          type: ["string", "null"]
        importedCount:
          type: integer
        skippedCount:
          type: integer

    OdooTestResult:
      type: object
      required: [ok, uid, url, error]
      properties:
        ok:
          type: boolean
        uid:
          type: ["integer", "null"]
        url:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    OdooSyncResult:
      type: object
      required: [ok, imported, skipped, orders, updated, changes, alertsCreated, dryRun, error]
      properties:
        ok:
          type: boolean
        imported:
          type: integer
        skipped:
          type: integer
        orders:
          type: array
          items:
            type: string
        updated:
          type: array
          items:
            type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/OrderChange"
        alertsCreated:
          type: integer
        dryRun:
          type: boolean
        error:
          type: ["string", "null"]

    OrderChange:
      type: object
      required: [odooRef, estado, fields]
      properties:
        odooRef:
          type: string
        estado:
          type: string
        fields:
          type: array
          items:
            type: string

    SyncAlert:
      type: object
      required: [id, ventaId, odooId, odooRef, estado, mensaje, campos, resuelta, createdAt, resolvedAt]
      properties:
        id:
          type: integer
        ventaId:
          type: integer
        odooId:
          type: ["integer", "null"]
        odooRef:
          type: ["string", "null"]
        estado:
          type: string
        mensaje:
          type: string
        campos:
          type: ["string", "null"]
        resuelta:
          type: boolean
        createdAt:
          type: string
        resolvedAt:
          type: ["string", "null"]

    Product:
      type: object
      required: [id, odooId, nombre, pesoOdoo, volumenOdoo, activo, apilable, fragil, dimensionesConfirmadas, createdAt, updatedAt]
      properties:
        id:
          type: integer
        odooId:
          type: integer
        odooRef:
          type: ["string", "null"]
        nombre:
          type: string
        categoria:
          type: ["string", "null"]
        uom:
          type: ["string", "null"]
        pesoOdoo:
          type: number
        volumenOdoo:
          type: number
        activo:
          type: boolean
        lastSyncAt:
          type: ["string", "null"]
        pesoKg:
          type: ["number", "null"]
          description: Peso real medido manualmente (kg)
        largoCm:
          type: ["number", "null"]
        anchoCm:
          type: ["number", "null"]
        altoCm:
          type: ["number", "null"]
        apilable:
          type: boolean
        fragil:
          type: boolean
        notas:
          type: ["string", "null"]
        dimensionesConfirmadas:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    ProductUpdate:
      type: object
      description: Only manual fields can be edited; Odoo-owned fields are rejected
      additionalProperties: false
      properties:
        pesoKg:
          type: ["number", "null"]
        largoCm:
          type: ["number", "null"]
        anchoCm:
          type: ["number", "null"]
        altoCm:
          type: ["number", "null"]
        apilable:
          type: boolean
        fragil:
          type: boolean
        notas:
          type: ["string", "null"]
        dimensionesConfirmadas:
          type: boolean

    ProductStats:
      type: object
      required: [total, confirmados, pendientes]
      properties:
        total:
          type: integer
        confirmados:
          type: integer
        pendientes:
          type: integer

    # --- DELIVERIES ---
    DeliveryItem:
      type: object
      required: [id, deliveryId, odooMoveId, descripcion, cantidadDemanda, cantidadEntregada]
      properties:
        id:
          type: integer
        deliveryId:
          type: integer
        productId:
          type: ["integer", "null"]
          description: Linked product in local catalog, null when not matched
        odooMoveId:
          type: integer
          description: stock.move id in Odoo
        descripcion:
          type: string
        cantidadDemanda:
          type: number
          description: product_uom_qty (demand quantity)
        cantidadEntregada:
          type: number
          description: quantity (delivered quantity, Odoo 19)
        uom:
          type: ["string", "null"]
        estado:
          type: ["string", "null"]

    Delivery:
      type: object
      required: [id, ventaId, odooId, nombre, estado, items, createdAt]
      properties:
        id:
          type: integer
        ventaId:
          type: integer
        odooId:
          type: integer
          description: stock.picking id in Odoo
        nombre:
          type: string
          description: Albarán reference (e.g. CCS/OUT/00307)
        estado:
          type: string
          description: "draft | waiting | confirmed | assigned | done | cancel"
        tipoOperacion:
          type: ["string", "null"]
          description: "picking_type_id name (e.g. Caracas Ordenes de entrega)"
        almacenOrigen:
          type: ["string", "null"]
          description: "location_id full name (e.g. CCS/Existencias)"
        almacenCodigo:
          type: ["string", "null"]
          description: "Prefix derived from almacenOrigen (e.g. CCS)"
        fechaProgramada:
          type: ["string", "null"]
          description: "scheduled_date as ISO datetime"
        fechaEfectiva:
          type: ["string", "null"]
          description: "date_done as ISO datetime, null if not yet delivered"
        documentoOrigen:
          type: ["string", "null"]
          description: "origin field from Odoo"
        backorderDeOdooId:
          type: ["integer", "null"]
          description: "backorder_id odooId of the original picking this is a backorder of"
        odooWriteDate:
          type: ["string", "null"]
        lastSyncAt:
          type: ["string", "null"]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryItem"

    DeliverySyncResult:
      type: object
      required: [ok, created, updated, itemsUpserted, unmatched, total]
      properties:
        ok:
          type: boolean
        created:
          type: integer
          description: New delivery rows inserted
        updated:
          type: integer
          description: Existing delivery rows updated (idempotent re-run)
        itemsUpserted:
          type: integer
          description: Total delivery item rows upserted
        unmatched:
          type: integer
          description: Pickings skipped because no matching sale was found
        total:
          type: integer
          description: Total outgoing pickings fetched from Odoo
        error:
          type: ["string", "null"]

    ProductSyncResult:
      type: object
      required: [ok, created, updated, total]
      properties:
        ok:
          type: boolean
        created:
          type: integer
        updated:
          type: integer
        total:
          type: integer
        error:
          type: ["string", "null"]

    Sale:
      type: object
      required: [id, cliente, volumenTotal, pesoTotal, destino, estado, createdAt]
      properties:
        id:
          type: integer
        cliente:
          type: string
        vendedor:
          type: ["string", "null"]
        personaContacto:
          type: ["string", "null"]
        numeroCel:
          type: ["string", "null"]
        tipoMaterial:
          type: ["string", "null"]
        volumenTotal:
          type: number
        pesoTotal:
          type: number
        destino:
          type: string
        estado:
          type: string
          description: "pendiente | despachado | entregado | cancelado"
        notas:
          type: ["string", "null"]
        odooRef:
          type: ["string", "null"]
          description: "Odoo sale order reference (e.g. S00042) when imported from Odoo"
        odooId:
          type: ["integer", "null"]
        pesoTotalOdoo:
          type: ["number", "null"]
          description: "Peso total importado originalmente desde Odoo (no lo pisa el cálculo local)"
        volumenTotalOdoo:
          type: ["number", "null"]
          description: "Volumen total importado originalmente desde Odoo (no lo pisa el cálculo local)"
        dimensionesIncompletas:
          type: boolean
          description: "true si alguna partida proviene de un producto sin dimensiones confirmadas"
        createdAt:
          type: string

    SaleInput:
      type: object
      required: [cliente, volumenTotal, pesoTotal, destino]
      properties:
        cliente:
          type: string
        vendedor:
          type: string
        personaContacto:
          type: string
        numeroCel:
          type: string
        tipoMaterial:
          type: string
        volumenTotal:
          type: number
        pesoTotal:
          type: number
        destino:
          type: string
        estado:
          type: string
        notas:
          type: string

    SaleUpdate:
      type: object
      properties:
        cliente:
          type: string
        vendedor:
          type: string
        personaContacto:
          type: string
        numeroCel:
          type: string
        tipoMaterial:
          type: string
        volumenTotal:
          type: number
        pesoTotal:
          type: number
        destino:
          type: string
        estado:
          type: string
        notas:
          type: string

    # --- SALE ITEMS ---
    SaleItem:
      type: object
      required: [id, ventaId, descripcion, cantidad, pesoUnitario, largo, ancho, alto, createdAt]
      properties:
        id:
          type: integer
        ventaId:
          type: integer
        productId:
          type: ["integer", "null"]
          description: "Producto del catálogo LogiFleet vinculado (null para bultos manuales)"
        descripcion:
          type: string
        cantidad:
          type: integer
        pesoUnitario:
          type: number
        largo:
          type: number
        ancho:
          type: number
        alto:
          type: number
        createdAt:
          type: string

    SaleItemInput:
      type: object
      required: [descripcion]
      properties:
        productId:
          type: ["integer", "null"]
          description: "Producto del catálogo LogiFleet vinculado (opcional)"
        descripcion:
          type: string
        cantidad:
          type: integer
        pesoUnitario:
          type: number
        largo:
          type: number
        ancho:
          type: number
        alto:
          type: number

    UnlinkedSaleItem:
      type: object
      required: [id, ventaId, descripcion, cantidad, cliente]
      properties:
        id:
          type: integer
        ventaId:
          type: integer
        descripcion:
          type: string
        cantidad:
          type: integer
        cliente:
          type: string

    LinkSaleItemInput:
      type: object
      required: [productId]
      properties:
        productId:
          type: integer

    # --- DISPATCHES ---
    Dispatch:
      type: object
      required: [id, ventaId, vehiculoId, choferId, fechaEstimadaSalida, fechaEstimadaLlegada, estado, createdAt]
      properties:
