openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Corporate Logistics Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vehicles
    description: Vehicle fleet management
  - name: personnel
    description: Driver and assistant management
  - name: sales
    description: Sales orders management
  - name: dispatches
    description: Dispatch and pre-dispatch management
  - name: tolls
    description: Toll routes management (legacy)
  - name: routes
    description: Routes management with toll stations and waypoints
  - name: fuel-prices
    description: Configurable fuel prices used in cost estimation
  - name: dashboard
    description: Dashboard and summary data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # --- FUEL PRICES ---
  /fuel-prices:
    get:
      operationId: listFuelPrices
      tags: [fuel-prices]
      summary: List configured fuel prices by fuel type
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FuelPrice"

  /fuel-prices/{tipoCombustible}:
    patch:
      operationId: updateFuelPrice
      tags: [fuel-prices]
      summary: Update (or create) the price per liter for a fuel type
      parameters:
        - name: tipoCombustible
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FuelPriceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelPrice"
        "400":
          description: Invalid input

  # --- VEHICLES ---
  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List all vehicles
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get a vehicle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
    patch:
      operationId: updateVehicle
      tags: [vehicles]
      summary: Update a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      summary: Delete a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- PERSONNEL ---
  /personnel:
    get:
      operationId: listPersonnel
      tags: [personnel]
      summary: List all personnel
      responses:
        "200":
          description: List of personnel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Personnel"
    post:
      operationId: createPersonnel
      tags: [personnel]
      summary: Create a personnel record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonnelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personnel"

  /personnel/{id}:
    get:
      operationId: getPersonnel
      tags: [personnel]
      summary: Get personnel by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Personnel record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personnel"
        "404":
          description: Not found
    patch:
      operationId: updatePersonnel
      tags: [personnel]
      summary: Update personnel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonnelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personnel"
        "404":
          description: Not found
    delete:
      operationId: deletePersonnel
      tags: [personnel]
      summary: Delete personnel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- SALES ---
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List all sales
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Create a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get a sale by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "404":
          description: Not found
    patch:
      operationId: updateSale
      tags: [sales]
      summary: Update a sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "404":
          description: Not found
    delete:
      operationId: deleteSale
      tags: [sales]
      summary: Delete a sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- SALE ITEMS ---
  /sales/{saleId}/items:
    get:
      operationId: listSaleItems
      tags: [sales]
      summary: List items for a sale
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of sale items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaleItem"
    post:
      operationId: createSaleItem
      tags: [sales]
      summary: Add an item to a sale
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleItem"

  /sales/items/{itemId}:
    patch:
      operationId: updateSaleItem
      tags: [sales]
      summary: Update a sale item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleItem"
        "404":
          description: Not found
    delete:
      operationId: deleteSaleItem
      tags: [sales]
      summary: Delete a sale item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- DISPATCHES ---
  /dispatches:
    get:
      operationId: listDispatches
      tags: [dispatches]
      summary: List all dispatches
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of dispatches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dispatch"
    post:
      operationId: createDispatch
      tags: [dispatches]
      summary: Create a dispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"

  /dispatches/{id}:
    get:
      operationId: getDispatch
      tags: [dispatches]
      summary: Get a dispatch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dispatch with route points and costs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchDetail"
        "404":
          description: Not found
    patch:
      operationId: updateDispatch
      tags: [dispatches]
      summary: Update a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
        "404":
          description: Not found
    delete:
      operationId: deleteDispatch
      tags: [dispatches]
      summary: Delete a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /dispatches/{id}/approve:
    post:
      operationId: approveDispatch
      tags: [dispatches]
      summary: Approve a dispatch (changes status to approved/en-route)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dispatch approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
        "404":
          description: Not found

  /dispatches/{id}/costs:
    get:
      operationId: getDispatchCosts
      tags: [dispatches]
      summary: Get travel costs for a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Travel costs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelCost"
        "404":
          description: Not found
    patch:
      operationId: updateDispatchCosts
      tags: [dispatches]
      summary: Update travel costs for a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelCostInput"
      responses:
        "200":
          description: Costs updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelCost"
        "404":
          description: Not found

  /dispatches/{id}/route-points:
    get:
      operationId: listRoutePoints
      tags: [dispatches]
      summary: List route points for a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Route points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoutePoint"
    post:
      operationId: addRoutePoint
      tags: [dispatches]
      summary: Add a route point to a dispatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutePointInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePoint"

  /dispatches/{dispatchId}/route-points/{pointId}:
    delete:
      operationId: deleteRoutePoint
      tags: [dispatches]
      summary: Remove a route point
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema:
            type: integer
        - name: pointId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- VEHICLE RECOMMENDATION ---
  /vehicles/recommend:
    post:
      operationId: recommendVehicle
      tags: [vehicles]
      summary: Recommend the best vehicle for a given load
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadRequirement"
      responses:
        "200":
          description: Recommended vehicles sorted by suitability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  # --- COST ESTIMATION ---
  /dispatches/{id}/estimate-costs:
    get:
      operationId: estimateDispatchCosts
      tags: [dispatches]
      summary: Estimate costs for a dispatch before approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Estimated costs breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostEstimate"
        "404":
          description: Not found

  /dispatches/estimate-costs-preview:
    post:
      operationId: estimateDispatchCostsPreview
      tags: [dispatches]
      summary: Estimate costs for a dispatch before it is created, using the same formula as estimateDispatchCosts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchCostEstimateInput"
      responses:
        "200":
          description: Estimated costs breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostEstimate"
        "400":
          description: Invalid input

  # --- TOLLS ---
  /tolls:
    get:
      operationId: listTolls
      tags: [tolls]
      summary: List all toll routes
      responses:
        "200":
          description: List of toll routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TollRoute"
    post:
      operationId: createToll
      tags: [tolls]
      summary: Create a toll route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TollRouteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TollRoute"

  /tolls/{id}:
    patch:
      operationId: updateToll
      tags: [tolls]
      summary: Update a toll route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TollRouteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TollRoute"
        "404":
          description: Not found
    delete:
      operationId: deleteToll
      tags: [tolls]
      summary: Delete a toll route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- ROUTES ---
  /routes:
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List all routes with embedded tolls and waypoints
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
    post:
      operationId: createRoute
      tags: [routes]
      summary: Create a route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"

  /routes/{id}:
    get:
      operationId: getRoute
      tags: [routes]
      summary: Get a route by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Route with tolls and waypoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: Not found
    patch:
      operationId: updateRoute
      tags: [routes]
      summary: Update a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: Not found
    delete:
      operationId: deleteRoute
      tags: [routes]
      summary: Delete a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /routes/{id}/tolls:
    post:
      operationId: addRouteToll
      tags: [routes]
      summary: Add a toll station to a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteTollInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteToll"

  /routes/{routeId}/tolls/{tollId}:
    patch:
      operationId: updateRouteToll
      tags: [routes]
      summary: Update a toll station's name, order, or tarifa
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
        - name: tollId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteTollUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteToll"
        "404":
          description: Not found
    delete:
      operationId: deleteRouteToll
      tags: [routes]
      summary: Remove a toll station from a route
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
        - name: tollId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /routes/{id}/waypoints:
    post:
      operationId: addRouteWaypoint
      tags: [routes]
      summary: Add a waypoint to a route (multidestino)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteWaypointInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteWaypoint"

  /routes/{routeId}/waypoints/{waypointId}:
    patch:
      operationId: updateRouteWaypoint
      tags: [routes]
      summary: Update a waypoint (reorder or rename)
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
        - name: waypointId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteWaypointUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteWaypoint"
        "404":
          description: Not found
    delete:
      operationId: deleteRouteWaypoint
      tags: [routes]
      summary: Remove a waypoint from a route
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
        - name: waypointId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # --- DASHBOARD ---
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/vehicle-schedule:
    get:
      operationId: getVehicleSchedule
      tags: [dashboard]
      summary: Get weekly vehicle availability schedule
      parameters:
        - name: weekStart
          in: query
          required: false
          schema:
            type: string
            description: ISO date string for start of week (defaults to current week)
      responses:
        "200":
          description: Vehicle schedule for the week
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleScheduleEntry"

  /dashboard/active-dispatches:
    get:
      operationId: getActiveDispatches
      tags: [dashboard]
      summary: Get currently active dispatches (in transit)
      responses:
        "200":
          description: Active dispatches with vehicle and route info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveDispatch"

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
